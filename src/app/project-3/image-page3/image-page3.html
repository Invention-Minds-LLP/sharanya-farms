<button class="back-btn" (click)="goBack()">← Back</button>
<div id="panorama" style="width:100%; height:100vh;"></div>

<!-- for tooltip -->
<div class="plot-tooltip" *ngIf="tooltipVisible" [style.left.px]="tooltipX"
[style.top.px]="tooltipY">
    <h3>{{tooltipTitle}}</h3>
    <p>{{tooltipDes}}</p>
</div>
